name: Release VSIX

# Pushing a tag like v0.1.0 builds the extension, packages a .vsix,
# and publishes it to the GitHub Releases page with the file attached.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required for the workflow to create a Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type-check
        run: npx tsc --noEmit

      - name: Package VSIX
        run: npx vsce package

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./*.vsix \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
